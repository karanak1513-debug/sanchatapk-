<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Sanchay</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 480px;
      padding: 48px 40px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 72px;
      font-weight: 800;
      color: #059669;
      margin: 0 0 12px;
    }
    p { color: #64748B; font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #059669;
      color: #FFFFFF;
      font-weight: 700;
      text-decoration: none;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
      transition: all 0.2s;
    }
    a:hover { background: #047857; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>The financial portal page you requested does not exist or has been relocated.</p>
    <a href="/">← Return to Cockpit</a>
  </div>
</body>
</html>
